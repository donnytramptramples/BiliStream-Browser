services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: production
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BASE_PATH: /
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
